# Extra code — TLS reverse proxy in front of the OpenAI-compatible API.
#
#   install -m 0644 deploy/nginx.conf /etc/nginx/sites-available/extra-code
#   ln -s /etc/nginx/sites-available/extra-code /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Two upstreams:
#   api    -> server/main.py      FastAPI shim (auth, rate limits, tokenizer, bot)
#   llama  -> llama-server        accelerated engine (prefix cache, -fa, draft)
#
# SSE is the fragile part: any buffering turns streaming into one blob at the
# end. proxy_buffering off, proxy_cache off and Connection "" (keepalive to the
# upstream, close to the client only when the body ends) are all required.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format extra_code '$remote_addr - $request_id "$request" $status '
                          '${body_bytes_sent}b ${request_time}s ua="$http_user_agent"';
    access_log /var/log/nginx/extra-code.access.log extra_code;
    error_log  /var/log/nginx/extra-code.error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75s;
    client_max_body_size 2m;

    # One zone per upstream so a flood against the FastAPI shim does not
    # starve the raw engine (and vice versa).
    limit_req_zone $binary_remote_addr zone=api_rl:10m   rate=10r/s;
    limit_req_zone $binary_remote_addr zone=llama_rl:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;

    upstream extra_code_api {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream llama_server {
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Plain HTTP: only redirect, plus an ACME challenge hole.
    server {
        listen 80;
        listen [::]:80;
        server_name api.example.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.example.com;

        ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # -- health, unauthenticated, cheap ---------------------------
        location = /health {
            proxy_pass http://extra_code_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        # -- OpenAI-compatible API through the shim --------------------
        location /v1/ {
            limit_req zone=api_rl burst=20 nodelay;
            limit_conn api_conn 8;

            proxy_pass http://extra_code_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;

            # streaming: no buffering anywhere in the chain
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            gzip off;

            # generation can take a while on CPU; the app has its own timeout
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # -- Swagger / OpenAPI ----------------------------------------
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass http://extra_code_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # -- raw llama-server, for direct benchmarking -----------------
        # Comment this block out if the shim is the only public surface.
        location /llama/ {
            limit_req zone=llama_rl burst=40 nodelay;

            rewrite ^/llama/(.*)$ /$1 break;
            proxy_pass http://llama_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            gzip off;

            proxy_connect_timeout 5s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        location / {
            return 404;
        }
    }
}
