# Drop-in: systemd drop-in that adds speculative decoding.
# Install to /etc/systemd/system/llama-server.service.d/speculative.conf
# Requires a second GGUF: a small draft model distilled from (or close to) the
# target. Delete this file to fall back to normal decoding.
[Service]
ExecStart=
ExecStart=/opt/llama.cpp/build/bin/llama-server \
  -m /srv/models/extra-code-q4_k_m.gguf \
  -md /srv/models/extra-code-draft-q4_k_m.gguf \
  --draft-max 8 \
  --draft-min 4 \
  --draft-p-min 0.8 \
  --host 127.0.0.1 --port 8080 \
  --ctx-size 4096 \
  --parallel 4 \
  --cont-batching \
  -fa \
  --prompt-cache /var/cache/extra-code/prompt.cache \
  --prompt-cache-ro \
  --cache-ram 4096 \
  --threads 8 \
  --n-predict 512 \
  --api-key ${LLAMA_API_KEY}
